apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: projectNameEnv
commonLabels:
  app: serviceNameEnv
  app.kubernetes.io/name: projectNameEnv
  app.kubernetes.io/version: v1
resources:
  - ../../base
patchesStrategicMerge:
  - service.yaml
  # - deployment.yaml
images:
  - name: cd-harbor.yunwdh.cn/library/serviceNameEnv
    newName: imagesNameEnv
    newTag: imageTagNameEnv
patches:
- path: ingress-patch.yaml
  target:
    kind: Ingress