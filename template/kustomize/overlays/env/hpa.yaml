apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: serviceNameEnv
spec:
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      targetAverageUtilization: 80
  - type: Resource
    resource:
      name: memory
      targetAverageValue: 800Mi
